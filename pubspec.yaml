name: nava_screen_ai
description: "AI-powered floating assistant that reads on-screen chats."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  provider: ^6.0.5
  google_mlkit_text_recognition: ^0.11.0
  flutter_overlay_window: ^0.4.2
  screenshot: ^2.1.1
  image: ^4.1.3
  permission_handler: ^11.0.1
  firebase_core: ^2.24.2
  cloud_firestore: ^4.13.6
  firebase_auth: ^4.15.3
  shared_preferences: ^2.5.5
  url_launcher: ^6.2.6
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

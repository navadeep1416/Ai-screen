name: Build Nava Screen AI APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # allows manual trigger from GitHub UI

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      # ── Step 1: Checkout code ─────────────────────────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ── Step 2: Setup Java 17 ─────────────────────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── Step 3: Setup Flutter ─────────────────────────────────────────────
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
          cache: true

      # ── Step 4: Check Flutter version ────────────────────────────────────
      - name: Flutter Version Info
        run: flutter --version

      # ── Step 5: Get dependencies ──────────────────────────────────────────
      - name: Install Dependencies
        run: flutter pub get

      # ── Step 6: Analyze code (optional, remove if slow) ───────────────────
      - name: Analyze Code
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      # ── Step 7: Run tests (optional) ──────────────────────────────────────
      - name: Run Tests
        run: flutter test
        continue-on-error: true

      # ── Step 8: Setup Android signing (keystore) ──────────────────────────
      - name: Setup Keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks
            echo "KEYSTORE_FILE=keystore.jks" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
            echo "SIGNING=true" >> $GITHUB_ENV
          else
            echo "SIGNING=false" >> $GITHUB_ENV
            echo "No keystore found, building unsigned APK"
          fi

      # ── Step 9: Build Release APK ─────────────────────────────────────────
      - name: Build Release APK
        run: |
          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --no-shrink \
            --split-per-abi
        env:
          JAVA_OPTS: "-Xmx4g"

      # ── Step 10: Rename APK with version + date ───────────────────────────
      - name: Rename APK
        run: |
          DATE=$(date +'%Y%m%d-%H%M')
          mkdir -p output
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             output/NavaScreenAI-arm64-$DATE.apk
          echo "APK_NAME=NavaScreenAI-arm64-$DATE.apk" >> $GITHUB_ENV

      # ── Step 11: Upload APK as artifact ───────────────────────────────────
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NavaScreenAI-APK
          path: output/*.apk
          retention-days: 30

      # ── Step 12: Show APK size ────────────────────────────────────────────
      - name: Show APK Info
        run: |
          echo "✅ Build Successful!"
          echo "📦 APK Details:"
          ls -lh output/*.apk
          du -sh output/*.apk

  # ── Optional: Build Debug APK for PRs ──────────────────────────────────────
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Debug APK
        run: flutter build apk --debug --target-platform android-arm64

      - name: Upload Debug APK
        uses: actions/upload-artifact@v3
        with:
          name: NavaScreenAI-Debug-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
